analysis:
  version: "3.0.0"
  min_posts: 5
  min_clean_characters: 500
  max_duplicate_ratio: 0.5
  ngram_sizes: [3, 4, 5]
  max_ngram_features: 100
  enable_semantic: true
  enable_behavior: true
  enable_evolution: true
  enable_migration: true
  enable_ai_profiler: true

semantic:
  embedding_model: "all-MiniLM-L6-v2"
  topic_count: 5
  top_words_per_topic: 8

behavior:
  burst_gap_threshold_hours: 1.0
  inactivity_threshold_days: 7

fusion:
  weights:
    style: 0.30
    semantic: 0.25
    behavioral: 0.20
    topic: 0.15
    temporal: 0.10

attribution:
  style_similarity_is_not_identity: true
  behavioral_association_is_not_identity: true
  psychological_inference: false

reports:
  include_raw_embeddings: false
  include_ngram_details: false
